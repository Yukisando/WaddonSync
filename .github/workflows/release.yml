name: Windows Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Compute release version
        id: version
        shell: pwsh
        run: |
          $content = Get-Content pubspec.yaml -Raw
          $major = 1
          $minor = 0

          if ($content -match 'version:\s+(\d+)\.(\d+)\.(\d+)(?:\+(\d+))?') {
            $major = [int]$matches[1]
            $minor = [int]$matches[2]
          }

          # Smart bump on every push to main:
          # keep major/minor from pubspec and use run_number as patch/build.
          $patch = [int]"${{ github.run_number }}"
          $build = [int]"${{ github.run_number }}"
          $version = "$major.$minor.$patch"

          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "BUILD_NUMBER=$build" >> $env:GITHUB_OUTPUT
          echo "Computed Version: $version+$build"
          
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
        
      - name: Generate secrets.dart
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path lib/config | Out-Null
          @"
          class Secrets {
            static const String googleClientId = '${{ secrets.GOOGLE_CLIENT_ID }}';
            static const String googleClientSecret = '${{ secrets.GOOGLE_CLIENT_SECRET }}';
          }
          "@ | Out-File -FilePath lib/config/secrets.dart -Encoding utf8

      - name: Install dependencies
        run: flutter pub get
        
      - name: Build Windows executable
        run: flutter build windows --release --build-name ${{ steps.version.outputs.VERSION }} --build-number ${{ steps.version.outputs.BUILD_NUMBER }}

      - name: Build MSIX and App Installer assets
        id: installer_assets
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $build = "${{ steps.version.outputs.BUILD_NUMBER }}"
          $tag = "v$version"
          $msixVersion = "$version.$build"
          $publishDir = Join-Path (Get-Location) "build\msix_publish"

          New-Item -ItemType Directory -Force -Path $publishDir | Out-Null
          dart run msix:publish --build-windows false --install-certificate false --version $msixVersion --publish-folder-path $publishDir

          $generatedMsix = Get-ChildItem -Path (Join-Path $publishDir "versions") -Filter *.msix -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $generatedMsix) {
            throw "MSIX package not found in publish output."
          }
          $generatedAppInstaller = Get-ChildItem -Path $publishDir -Filter *.appinstaller -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $generatedAppInstaller) {
            throw "App Installer file not found in publish output."
          }

          $msixAssetName = "WaddonSync-$version.msix"
          $appInstallerAssetName = "WaddonSync-$version.appinstaller"

          Copy-Item $generatedMsix.FullName -Destination $msixAssetName -Force

          $msixUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/$msixAssetName"
          $appInstallerUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/$appInstallerAssetName"

          $appInstallerContent = Get-Content $generatedAppInstaller.FullName -Raw
          $appInstallerContent = $appInstallerContent -replace '(?s)(<AppInstaller\b[^>]*\bUri=")[^"]*(")', "`$1$appInstallerUrl`$2"
          $appInstallerContent = $appInstallerContent -replace '(?s)(<MainPackage\b[^>]*\bUri=")[^"]*(")', "`$1$msixUrl`$2"
          $appInstallerContent | Out-File -FilePath $appInstallerAssetName -Encoding utf8

          echo "MSIX_ASSET_NAME=$msixAssetName" >> $env:GITHUB_OUTPUT
          echo "APPINSTALLER_ASSET_NAME=$appInstallerAssetName" >> $env:GITHUB_OUTPUT
        
      - name: Create release archive
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $releaseName = "WaddonSync-Windows-$version"
          
          # Create a clean directory for the release
          New-Item -ItemType Directory -Force -Path release
          
          # Copy the built application
          Copy-Item -Path "build\windows\x64\runner\Release\*" -Destination "release\" -Recurse
          
          # Create a zip file
          Compress-Archive -Path "release\*" -DestinationPath "$releaseName.zip"
          
          echo "RELEASE_NAME=$releaseName" >> $env:GITHUB_OUTPUT
        id: archive
        
      - name: Generate release notes
        id: release_notes
        shell: pwsh
        run: |
          $notes = @"
          ## WaddonSync Windows Release
          
          **Version:** ${{ steps.version.outputs.VERSION }}
          **Build:** ${{ steps.version.outputs.BUILD_NUMBER }}
          **Build Date:** $(Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC")
          
          ### Installation
          1. Preferred: download and open ``${{ steps.installer_assets.outputs.APPINSTALLER_ASSET_NAME }}``
          2. Direct package option: install ``${{ steps.installer_assets.outputs.MSIX_ASSET_NAME }}``
          3. Alternative portable mode: download the zip file, extract it, and run ``waddonsync.exe``
          
          ### Features
          - Backup and sync World of Warcraft addons and settings
          - Google Drive integration for cloud backups
          - Dark mode support with theme toggle
          - Compress and apply backups with ease
          
          ### Requirements
          - Windows 10 or later
          
          ---
          *Automated build from commit ${{ github.sha }}*
          "@
          
          # Save to file for the release
          $notes | Out-File -FilePath release_notes.md -Encoding utf8
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: WaddonSync v${{ steps.version.outputs.VERSION }}
          body_path: release_notes.md
          files: |
            ${{ steps.archive.outputs.RELEASE_NAME }}.zip
            ${{ steps.installer_assets.outputs.MSIX_ASSET_NAME }}
            ${{ steps.installer_assets.outputs.APPINSTALLER_ASSET_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
