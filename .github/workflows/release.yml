name: Windows Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Compute release version
        id: version
        shell: pwsh
        run: |
          $content = Get-Content pubspec.yaml -Raw
          $major = 1
          $minor = 0

          if ($content -match 'version:\s+(\d+)\.(\d+)\.(\d+)(?:\+(\d+))?') {
            $major = [int]$matches[1]
            $minor = [int]$matches[2]
          }

          # Smart bump on every push to main:
          # keep major/minor from pubspec and use run_number as patch/build.
          $patch = [int]"${{ github.run_number }}"
          $build = [int]"${{ github.run_number }}"
          $version = "$major.$minor.$patch"

          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "BUILD_NUMBER=$build" >> $env:GITHUB_OUTPUT
          echo "Computed Version: $version+$build"
          
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
        
      - name: Generate secrets.dart
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path lib/config | Out-Null
          @"
          class Secrets {
            static const String googleClientId = '${{ secrets.GOOGLE_CLIENT_ID }}';
            static const String googleClientSecret = '${{ secrets.GOOGLE_CLIENT_SECRET }}';
          }
          "@ | Out-File -FilePath lib/config/secrets.dart -Encoding utf8

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare code signing certificate (optional)
        id: codesign
        shell: pwsh
        env:
          CODE_SIGN_CERT_PFX_BASE64: ${{ secrets.CODE_SIGN_CERT_PFX_BASE64 }}
          CODE_SIGN_CERT_PASSWORD: ${{ secrets.CODE_SIGN_CERT_PASSWORD }}
          CODE_SIGN_TIMESTAMP_URL: ${{ secrets.CODE_SIGN_TIMESTAMP_URL }}
        run: |
          $hasPfx = -not [string]::IsNullOrWhiteSpace($env:CODE_SIGN_CERT_PFX_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:CODE_SIGN_CERT_PASSWORD)

          if (-not $hasPfx -or -not $hasPassword) {
            Write-Host "Code signing disabled: CODE_SIGN_CERT_PFX_BASE64/CODE_SIGN_CERT_PASSWORD not set."
            echo "ENABLED=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          New-Item -ItemType Directory -Force -Path certs | Out-Null
          $pfxPath = Join-Path (Get-Location) "certs\codesign.pfx"
          [IO.File]::WriteAllBytes(
            $pfxPath,
            [Convert]::FromBase64String($env:CODE_SIGN_CERT_PFX_BASE64)
          )

          $timestampUrl = if ([string]::IsNullOrWhiteSpace($env:CODE_SIGN_TIMESTAMP_URL)) {
            "http://timestamp.digicert.com"
          } else {
            $env:CODE_SIGN_TIMESTAMP_URL
          }

          echo "ENABLED=true" >> $env:GITHUB_OUTPUT
          echo "PFX_PATH=$pfxPath" >> $env:GITHUB_OUTPUT
          echo "TIMESTAMP_URL=$timestampUrl" >> $env:GITHUB_OUTPUT
        
      - name: Build Windows executable
        run: flutter build windows --release --build-name ${{ steps.version.outputs.VERSION }} --build-number ${{ steps.version.outputs.BUILD_NUMBER }}

      - name: Sign app executable (optional)
        if: steps.codesign.outputs.ENABLED == 'true'
        shell: pwsh
        env:
          CODE_SIGN_CERT_PASSWORD: ${{ secrets.CODE_SIGN_CERT_PASSWORD }}
        run: |
          $signtool = (Get-Command signtool.exe -ErrorAction Stop).Source
          & $signtool sign /fd SHA256 /f "${{ steps.codesign.outputs.PFX_PATH }}" /p "$env:CODE_SIGN_CERT_PASSWORD" /tr "${{ steps.codesign.outputs.TIMESTAMP_URL }}" /td SHA256 "build\windows\x64\runner\Release\waddonsync.exe"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Build setup installer
        id: installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $installerName = "WaddonSync-Installer-$version"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "/DMyOutputBaseFilename=$installerName" "installer\WaddonSync.iss"
          echo "INSTALLER_ASSET_NAME=$installerName.exe" >> $env:GITHUB_OUTPUT

      - name: Sign installer executable (optional)
        if: steps.codesign.outputs.ENABLED == 'true'
        shell: pwsh
        env:
          CODE_SIGN_CERT_PASSWORD: ${{ secrets.CODE_SIGN_CERT_PASSWORD }}
        run: |
          $signtool = (Get-Command signtool.exe -ErrorAction Stop).Source
          & $signtool sign /fd SHA256 /f "${{ steps.codesign.outputs.PFX_PATH }}" /p "$env:CODE_SIGN_CERT_PASSWORD" /tr "${{ steps.codesign.outputs.TIMESTAMP_URL }}" /td SHA256 "${{ steps.installer.outputs.INSTALLER_ASSET_NAME }}"
        
      - name: Create portable archive
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $releaseName = "WaddonSync-Portable-$version"
          
          # Create a clean directory for the release
          New-Item -ItemType Directory -Force -Path release
          
          # Copy the built application
          Copy-Item -Path "build\windows\x64\runner\Release\*" -Destination "release\" -Recurse
          
          # Create a portable zip file
          Compress-Archive -Path "release\*" -DestinationPath "$releaseName.zip"
          
          echo "PORTABLE_ASSET_NAME=$releaseName.zip" >> $env:GITHUB_OUTPUT
        id: portable
        
      - name: Generate release notes
        id: release_notes
        shell: pwsh
        run: |
          $notes = @"
          ## WaddonSync Windows Release
          
          **Version:** ${{ steps.version.outputs.VERSION }}
          **Build:** ${{ steps.version.outputs.BUILD_NUMBER }}
          **Build Date:** $(Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC")
          
          ### Installation
           1. Installer option (recommended): download and run ``${{ steps.installer.outputs.INSTALLER_ASSET_NAME }}``
             - Standard setup wizard
             - Lets users choose install folder
             - Adds native uninstall entry in Windows Installed Apps
           2. Portable option: download ``${{ steps.portable.outputs.PORTABLE_ASSET_NAME }}``, extract, and run ``waddonsync.exe``
          
          ### Features
          - Backup and sync World of Warcraft addons and settings
          - Google Drive integration for cloud backups
          - Dark mode support with theme toggle
          - Compress and apply backups with ease
          
          ### Requirements
          - Windows 10 or later

          ### Signing
          - Installer/app binaries are Authenticode-signed when code-signing secrets are configured in the repository.
          
          ---
          *Automated build from commit ${{ github.sha }}*
          "@
          
          # Save to file for the release
          $notes | Out-File -FilePath release_notes.md -Encoding utf8
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: WaddonSync v${{ steps.version.outputs.VERSION }}
          body_path: release_notes.md
          files: |
            ${{ steps.portable.outputs.PORTABLE_ASSET_NAME }}
            ${{ steps.installer.outputs.INSTALLER_ASSET_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
